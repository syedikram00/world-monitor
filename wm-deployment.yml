apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-monitor-app-deployment
  namespace: world-monitor-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: world-monitor-app-deployment
  template:
    metadata:
      labels:
        app: world-monitor-app-deployment
    spec:
      containers:
       - name: world-monitor-app-deployment
         image: ikramsyed/world-monitor:latest
         ports:
         - containerPort: 8001
         env:
         - name: DATABASE_URL
           valueFrom:
             secretKeyRef:
               name: wm-app-secret
               key: DATABASE_URL
         - name: GEMINI_API_KEY  
           valueFrom:
            secretKeyRef:
              name: wm-app-secret
              key: GEMINI_API_KEY

         envFrom:
          - secretRef:
              name: wm-app-secret

