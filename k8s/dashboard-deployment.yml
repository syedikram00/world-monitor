apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashbaord-deployment
  namespace: world-monitor-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-deployment
  template:
    metadata:
      labels:
        app: dashboard-deployment
    spec:
      containers:
       - name: dashboard-deployment
         image: ikramsyed/dashboard-wm:v4
         imagePullPolicy: Always
         ports:
         - containerPort: 8000
         env:
         - name: DATABASE_URL
           valueFrom:
             secretKeyRef:
               name: wm-app-secret
               key: DATABASE_URL
         - name: GEMINI_API_KEY  
           valueFrom:
            secretKeyRef:
              name: wm-app-secret
              key: GEMINI_API_KEY

         envFrom:
          - secretRef:
              name: wm-app-secret

